[project]
name = "subway"
version = "0.1.0"
description = "Infer per-trip NYC subway occupancy from turnstile counts and GTFS, and animate it."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "polars>=1.0",
    "pyarrow>=15",
    # numba/llvmlite: newer llvmlite releases ship no Intel-macOS wheels; 0.62 / 0.45 do.
    "numba>=0.62",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
subway = "subway.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
venvPath = "."
venv = ".venv"
